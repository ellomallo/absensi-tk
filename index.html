<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Scanner Absensi TK</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>


<style>

body{

margin:0;

background:
linear-gradient(
135deg,
#fff7fb,
#f5f1ff
);

font-family:
Arial,
sans-serif;

min-height:100vh;

}


.header{

text-align:center;

padding:25px 15px 10px;

}


.logo{

font-size:40px;

}


.title{

font-size:28px;

font-weight:bold;

color:#6f5bc9;

}


.subtitle{

color:#777;

}


.container-scanner{

max-width:650px;

margin:auto;

padding:15px;

}


.mode-box{

display:flex;

gap:10px;

margin-bottom:15px;

}


.mode-btn{

flex:1;

padding:14px;

border-radius:15px;

border:2px solid #ddd;

background:white;

font-weight:bold;

font-size:17px;

}


.mode-btn.active{

background:#7b67d8;

border-color:#7b67d8;

color:white;

}


.scanner-card{

background:white;

border-radius:25px;

padding:20px;

box-shadow:
0 10px 40px
rgba(60,40,100,.10);

}


#reader{

width:100%;

overflow:hidden;

border-radius:20px;

}


.scan-frame{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

width:60%;

aspect-ratio:1;

border:
4px solid #fff;

border-radius:20px;

box-shadow:
0 0 0 9999px
rgba(0,0,0,.20);

pointer-events:none;

}


.camera-wrapper{

position:relative;

}


.result{

margin-top:20px;

padding:20px;

border-radius:20px;

text-align:center;

display:none;

}


.result.success{

display:block;

background:#dcfce7;

color:#166534;

}


.result.error{

display:block;

background:#fee2e2;

color:#991b1b;

}


.result-icon{

font-size:55px;

}


.student-name{

font-size:27px;

font-weight:bold;

margin:8px 0;

}


.buttons{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-top:15px;

}


.btn-main{

border:0;

border-radius:14px;

padding:13px;

font-weight:bold;

}


.status-bar{

text-align:center;

padding:10px;

color:#777;

font-size:14px;

}


input[type=file]{

display:none;

}

</style>

</head>


<body>


<div class="header">

<div class="logo">
🎓
</div>

<div class="title">
TK CERIA
</div>

<div class="subtitle">
Scanner Absensi Siswa
</div>

</div>



<div class="container-scanner">


<!-- MODE -->

<div class="mode-box">


<button
id="modeMasuk"
class="mode-btn active"
onclick="setMode('masuk')">

🏫 MASUK

</button>


<button
id="modePulang"
class="mode-btn"
onclick="setMode('pulang')">

🏠 PULANG

</button>


</div>



<div class="scanner-card">


<div class="text-center mb-3">

<h4 id="modeTitle">
📚 Scan Absen Masuk
</h4>

<p class="text-muted mb-0">

Arahkan QR Code siswa
ke kamera

</p>

</div>



<div class="camera-wrapper">

<div id="reader"></div>

<div class="scan-frame"></div>

</div>



<div class="status-bar"
id="cameraStatus">

Kamera belum aktif

</div>



<div class="buttons">


<button
class="btn btn-primary btn-main"
onclick="startScanner()">

📷 Aktifkan Kamera

</button>


<button
class="btn btn-outline-primary btn-main"
onclick="switchCamera()">

🔄 Ganti Kamera

</button>


<label
class="btn btn-outline-secondary btn-main">

🖼️ Scan Foto

<input
type="file"
accept="image/*"
id="fileInput"
onchange="scanFile(event)">

</label>


<button
class="btn btn-outline-danger btn-main"
onclick="stopScanner()">

⏹️ Matikan

</button>


</div>



<div
id="result"
class="result">

<div
id="resultIcon"
class="result-icon">

</div>


<div
id="resultText">

</div>

</div>


</div>

</div>



<script>


/* =====================================================
API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx_2C-GuZ_9utfh8-phU6O2eqB7ZRqkLS_7Y0wg3lGtxv82BZc5xcD06b-vsJBoT_VQ/exec";


/* =====================================================
VARIABLE
===================================================== */

let scanner = null;

let running = false;

let cameraMode = "environment";

let attendanceMode = "masuk";

let processing = false;


/* =====================================================
MODE
===================================================== */

function setMode(mode){

attendanceMode =
mode;


document
.getElementById(
"modeMasuk"
)
.classList
.toggle(
"active",
mode==="masuk"
);


document
.getElementById(
"modePulang"
)
.classList
.toggle(
"active",
mode==="pulang"
);


document
.getElementById(
"modeTitle"
)
.innerText =
mode==="masuk"
? "📚 Scan Absen Masuk"
: "🏠 Scan Absen Pulang";


}


/* =====================================================
START CAMERA
===================================================== */

async function startScanner(){

if(running){
return;
}


document
.getElementById(
"cameraStatus"
)
.innerText =
"Mengaktifkan kamera...";


try{

scanner =
new Html5Qrcode(
"reader"
);


await scanner.start(

{
facingMode:
cameraMode
},

{
fps:10,

qrbox:{
width:250,
height:250
}

},

onScanSuccess,

function(errorMessage){

// Abaikan error scan kecil

}

);


running=true;


document
.getElementById(
"cameraStatus"
)
.innerText =
cameraMode==="environment"
? "Kamera belakang aktif"
: "Kamera depan aktif";


}
catch(error){

console.error(error);


document
.getElementById(
"cameraStatus"
)
.innerText =
"Gagal membuka kamera";


showError(
"❌ Kamera tidak dapat digunakan. Pastikan izin kamera diberikan."
);

}

}


/* =====================================================
STOP
===================================================== */

async function stopScanner(){

if(
scanner &&
running
){

try{

await scanner.stop();

scanner.clear();

}
catch(error){

console.log(error);

}

}


scanner=null;

running=false;


document
.getElementById(
"cameraStatus"
)
.innerText =
"Kamera belum aktif";

}


/* =====================================================
SWITCH CAMERA
===================================================== */

async function switchCamera(){

cameraMode =
cameraMode==="environment"
? "user"
: "environment";


if(running){

await stopScanner();

await startScanner();

}

}


/* =====================================================
SCAN SUCCESS
===================================================== */

async function onScanSuccess(
decodedText
){

if(processing){
return;
}


processing=true;


await stopScanner();


showLoading();


sendAttendance(
decodedText
);

}


/* =====================================================
SEND ATTENDANCE
===================================================== */

function sendAttendance(qr){

const callbackName =
"absensiCallback_" +
Date.now();


window[callbackName] =
function(result){

try{

delete window[
callbackName
];

}
catch(e){}


handleResult(
result
);

};


const script =
document.createElement(
"script"
);


const url =
API_URL
+"?action=scan"
+"&mode="
+encodeURIComponent(
attendanceMode
)
+"&qr="
+encodeURIComponent(
qr
)
+"&callback="
+callbackName
+"&t="
+Date.now();


script.src=url;


script.onerror =
function(){

showError(
"❌ Server absensi tidak dapat dihubungi."
);

processing=false;

};


document.body
.appendChild(
script
);

}


/* =====================================================
RESULT
===================================================== */

function handleResult(result){

processing=false;


if(
result &&
result.success
){

if(
result.type==="MASUK"
){

showSuccess(

"🎉",

result.siswa,

"Berhasil Absen Masuk",

result.jam,

result.status

);


speak(
"Selamat datang "
+result.siswa
+". Selamat belajar!"
);

}
else
if(
result.type==="PULANG"
){

showSuccess(

"🏠",

result.siswa,

"Berhasil Absen Pulang",

result.jam,

""

);


speak(
"Sampai jumpa "
+result.siswa
+". Hati-hati di jalan!"
);

}


setTimeout(
function(){

startScanner();

},
3500
);


return;

}


if(
result.type==="DUPLICATE"
){

showError(

"😊 " +
result.message

);


speak(
result.message
);


setTimeout(
function(){

startScanner();

},
3000
);


return;

}


if(
result.type==="DUPLICATE_OUT"
){

showError(

"😊 " +
result.message

);


speak(
result.message
);


setTimeout(
function(){

startScanner();

},
3000
);


return;

}


if(
result.type==="NOT_YET_IN"
){

showError(

"⚠️ " +
result.message

);


speak(
result.message
);


setTimeout(
function(){

startScanner();

},
3000
);


return;

}


showError(

"😅 " +
(
result.message ||
"QR tidak dikenali."
)

);


setTimeout(
function(){

startScanner();

},
3000
);

}


/* =====================================================
LOADING
===================================================== */

function showLoading(){

const box =
document.getElementById(
"result"
);


box.className =
"result success";


box.style.display =
"block";


document
.getElementById(
"resultIcon"
)
.innerText =
"⏳";


document
.getElementById(
"resultText"
)
.innerHTML =
"<b>Memproses absensi...</b>";

}


/* =====================================================
SUCCESS
===================================================== */

function showSuccess(
icon,
name,
message,
time,
status
){

const box =
document.getElementById(
"result"
);


box.className =
"result success";


box.style.display =
"block";


document
.getElementById(
"resultIcon"
)
.innerText =
icon;


document
.getElementById(
"resultText"
)
.innerHTML =

'<div class="student-name">'
+escapeHTML(name)
+'</div>'

+'<div>'
+escapeHTML(message)
+'</div>'

+'<div class="mt-2">'
+'🕐 '
+escapeHTML(time)
+'</div>'

+(status
?
'<div class="mt-2">'
+'Status: <b>'
+escapeHTML(status)
+'</b>'
+'</div>'
:"");

}


/* =====================================================
ERROR
===================================================== */

function showError(message){

const box =
document.getElementById(
"result"
);


box.className =
"result error";


box.style.display =
"block";


document
.getElementById(
"resultIcon"
)
.innerText =
"😅";


document
.getElementById(
"resultText"
)
.innerHTML =
'<b>'
+escapeHTML(message)
+'</b>';

}


/* =====================================================
SPEECH
===================================================== */

function speak(text){

if(
!"speechSynthesis"
in window
){

return;

}


window
.speechSynthesis
.cancel();


const speech =
new SpeechSynthesisUtterance(
text
);


speech.lang =
"id-ID";


speech.rate =
0.9;


speech.pitch =
1.15;


speech.volume =
1;


window
.speechSynthesis
.speak(
speech
);

}


/* =====================================================
SCAN FILE
===================================================== */

async function scanFile(event){

const file =
event.target.files[0];


if(!file){
return;
}


const temp =
new Html5Qrcode(
"reader"
);


try{

const result =
await temp.scanFile(
file,
true
);


sendAttendance(
result
);

}
catch(error){

showError(
"QR Code tidak ditemukan pada foto."
);

}

finally{

try{

temp.clear();

}
catch(e){}

event.target.value="";

}

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

return String(
value || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
INIT
===================================================== */

setMode(
"masuk"
);

</script>

</body>

</html>
