<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>
  Absensi TK
</title>


<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">


<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  rel="stylesheet">


<script
  src="https://unpkg.com/html5-qrcode">
</script>


<style>

body {

  margin: 0;

  min-height: 100vh;

  background:
    linear-gradient(
      135deg,
      #ffe5ec,
      #e7f0ff
    );

  font-family:
    Arial,
    sans-serif;

}


.container-main {

  max-width: 600px;

  margin: auto;

  padding: 20px;

}


.logo {

  font-size: 60px;

}


.title {

  font-size: 28px;

  font-weight: bold;

}


.subtitle {

  color: #777;

}


.mode-container {

  display: flex;

  gap: 10px;

  margin-bottom: 15px;

}


.mode-btn {

  flex: 1;

  padding: 14px;

  border: none;

  border-radius: 15px;

  font-weight: bold;

  background: white;

}


.mode-btn.active {

  background: #7c8cff;

  color: white;

}


.camera-card {

  background: white;

  border-radius: 25px;

  padding: 15px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.1);

}


#reader {

  width: 100%;

}


.scan-message {

  margin-top: 20px;

  background: white;

  border-radius: 20px;

  padding: 20px;

  text-align: center;

}


.student-name {

  font-size: 28px;

  font-weight: bold;

}


.emoji {

  font-size: 60px;

}


button {

  border-radius: 15px !important;

}


</style>

</head>


<body>


<div class="container-main">


<div class="text-center">

  <div class="logo">
    🏫
  </div>

  <div class="title">
    ABSENSI TK CERIA
  </div>

  <div class="subtitle">
    Scan QR untuk melakukan absensi
  </div>

</div>


<!-- MODE -->

<div class="mode-container mt-4">


<button
  id="modeMasuk"
  class="mode-btn active"
  onclick="setMode('masuk')">

  🏫 MASUK

</button>


<button
  id="modePulang"
  class="mode-btn"
  onclick="setMode('pulang')">

  🏠 PULANG

</button>


</div>


<!-- CAMERA -->

<div class="camera-card">


<div id="reader"></div>


<div class="d-grid gap-2 mt-3">


<button
  id="startBtn"
  class="btn btn-primary"
  onclick="startCamera()">

  <i class="bi bi-camera"></i>

  AKTIFKAN KAMERA

</button>


<button
  class="btn btn-outline-primary"
  onclick="switchCamera()">

  <i class="bi bi-camera-reverse"></i>

  GANTI KAMERA

</button>


<label
  class="btn btn-outline-secondary">

  <i class="bi bi-image"></i>

  SCAN DARI FOTO

  <input
    type="file"
    accept="image/*"
    hidden
    onchange="scanFromFile(event)">

</label>


</div>


<div
  id="cameraStatus"
  class="text-center text-muted mt-3">

  Kamera belum aktif

</div>


</div>


<!-- RESULT -->

<div
  id="result"
  class="scan-message">

  <div class="emoji">
    👋
  </div>

  <h4>
    Silakan tunjukkan QR
  </h4>

  <p class="text-muted">
    Arahkan QR ke kamera
  </p>

</div>


</div>


<script>


/* ==================================================
   CONFIG
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx_2C-GuZ_9utfh8-phU6O2eqB7ZRqkLS_7Y0wg3lGtxv82BZc5xcD06b-vsJBoT_VQ/exec";


let scanner = null;

let currentCamera =
  "environment";

let currentMode =
  "masuk";

let scanning =
  false;

let processing =
  false;


/* ==================================================
   MODE
================================================== */

function setMode(mode) {

  currentMode =
    mode;


  document
    .getElementById(
      "modeMasuk"
    )
    .classList.toggle(
      "active",
      mode === "masuk"
    );


  document
    .getElementById(
      "modePulang"
    )
    .classList.toggle(
      "active",
      mode === "pulang"
    );


  if (mode === "masuk") {

    showMessage(
      "🏫",
      "MODE MASUK",
      "Silakan scan QR siswa"
    );

  } else {

    showMessage(
      "🏠",
      "MODE PULANG",
      "Silakan scan QR siswa"
    );

  }

}


/* ==================================================
   START CAMERA
================================================== */

async function startCamera() {

  if (scanning) {
    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          currentCamera
      },

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      () => {}

    );


    scanning = true;


    document
      .getElementById(
        "cameraStatus"
      )
      .innerText =
        currentCamera ===
        "environment"

        ? "📷 Kamera belakang aktif"

        : "🤳 Kamera depan aktif";


    document
      .getElementById(
        "startBtn"
      )
      .style.display =
        "none";


  } catch(error) {

    console.error(error);


    showMessage(
      "😥",
      "Kamera tidak dapat digunakan",
      "Pastikan browser mengizinkan kamera."
    );

  }

}


/* ==================================================
   SWITCH CAMERA
================================================== */

async function switchCamera() {

  if (scanning) {

    try {

      await scanner.stop();

      await scanner.clear();

    } catch(e) {}

    scanning = false;

  }


  currentCamera =
    currentCamera ===
    "environment"

      ? "user"

      : "environment";


  await startCamera();

}


/* ==================================================
   QR SUCCESS
================================================== */

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing = true;


  sendQR(decodedText);


  setTimeout(
    () => {

      processing = false;

    },
    3000
  );

}


/* ==================================================
   SEND QR
================================================== */

function sendQR(qr) {

  const callbackName =
    "qrCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      handleResult(data);


      try {

        delete window[
          callbackName
        ];

      } catch(e) {}

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=scan" +
    "&mode=" +
    encodeURIComponent(
      currentMode
    ) +
    "&qr=" +
    encodeURIComponent(
      qr
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      showMessage(
        "😥",
        "Koneksi bermasalah",
        "Coba scan kembali."
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/* ==================================================
   HANDLE RESULT
================================================== */

function handleResult(data) {

  if (!data) {

    showMessage(
      "😥",
      "Terjadi kesalahan",
      "Silakan coba lagi."
    );

    return;

  }


  /* MASUK */

  if (
    data.success &&
    data.type === "MASUK"
  ) {

    showMessage(

      "🎉",

      "SELAMAT DATANG!",

      `

      <div class="student-name">

        ${escapeHTML(
          data.siswa
        )}

      </div>

      <div>
        Kelas ${escapeHTML(
          data.kelas
        )}
      </div>

      <div class="mt-2">

        ⏰
        ${escapeHTML(
          data.jam
        )}

      </div>

      <div class="mt-2">

        Status:
        <b>
          ${escapeHTML(
            data.status
          )}
        </b>

      </div>

      <div class="mt-3">

        🌈 Selamat belajar hari ini!

      </div>

      `

    );


    speak(
      "Selamat datang " +
      data.siswa +
      ". Selamat belajar hari ini."
    );


    return;

  }


  /* PULANG */

  if (
    data.success &&
    data.type === "PULANG"
  ) {

    showMessage(

      "🏠",

      "SAMPAI JUMPA!",

      `

      <div class="student-name">

        ${escapeHTML(
          data.siswa
        )}

      </div>

      <div>
        Kelas ${escapeHTML(
          data.kelas
        )}
      </div>

      <div class="mt-2">

        ⏰
        ${escapeHTML(
          data.jam
        )}

      </div>

      <div class="mt-3">

        👋 Hati-hati di jalan!

      </div>

      `

    );


    speak(
      "Sampai jumpa " +
      data.siswa +
      ". Hati-hati di jalan."
    );


    return;

  }


  /* DUPLICATE */

  if (
    data.type === "DUPLICATE"
  ) {

    showMessage(

      "😊",

      "SUDAH ABSEN",

      `

      <div class="student-name">

        ${escapeHTML(
          data.siswa
        )}

      </div>

      <div>
        Kamu sudah melakukan absensi.
      </div>

      <div class="mt-2">
        ⏰ ${escapeHTML(data.jam)}
      </div>

      `

    );


    speak(
      data.siswa +
      " sudah melakukan absensi."
    );


    return;

  }


  /* BELUM MASUK */

  if (
    data.type === "BELUM_MASUK"
  ) {

    showMessage(

      "🙂",

      "BELUM ABSEN MASUK",

      data.message

    );


    speak(
      "Silakan melakukan absensi masuk terlebih dahulu."
    );


    return;

  }


  /* DUPLICATE PULANG */

  if (
    data.type ===
    "DUPLICATE_PULANG"
  ) {

    showMessage(

      "😊",

      "SUDAH ABSEN PULANG",

      `

      ${escapeHTML(
        data.message
      )}

      <br>

      Jam:
      ${escapeHTML(
        data.jam
      )}

      `

    );


    return;

  }


  /* NOT FOUND */

  if (
    data.type ===
    "NOT_FOUND"
  ) {

    showMessage(

      "😅",

      "QR TIDAK DIKENALI",

      "QR ini belum terdaftar."

    );


    speak(
      "QR tidak dikenali."
    );


    return;

  }


  /* INACTIVE */

  if (
    data.type ===
    "INACTIVE"
  ) {

    showMessage(

      "⚠️",

      "DATA TIDAK AKTIF",

      data.message

    );


    return;

  }


  /* ERROR */

  showMessage(

    "😥",

    "TERJADI KESALAHAN",

    data.message ||
    "Silakan coba kembali."

  );

}


/* ==================================================
   FILE SCANNER
================================================== */

async function scanFromFile(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const fileScanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    const result =
      await fileScanner
        .scanFile(
          file,
          true
        );


    sendQR(result);


  } catch(error) {

    showMessage(
      "😅",
      "QR TIDAK TERBACA",
      "Coba gunakan foto QR yang lebih jelas."
    );

  }


  event.target.value = "";

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
  emoji,
  title,
  message
) {

  document
    .getElementById(
      "result"
    )
    .innerHTML = `

      <div class="emoji">

        ${emoji}

      </div>

      <h4>

        ${title}

      </h4>

      <div>

        ${message}

      </div>

    `;

}


/* ==================================================
   SPEECH
================================================== */

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  window
    .speechSynthesis
    .cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "id-ID";


  speech.rate =
    0.9;


  speech.pitch =
    1.15;


  speech.volume =
    1;


  window
    .speechSynthesis
    .speak(
      speech
    );

}


/* ==================================================
   ESCAPE
================================================== */

function escapeHTML(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
