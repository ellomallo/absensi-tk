<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#7566d9"
  >

  <title>Absensi Siswa - TK CERIA</title>


  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >


  <!-- QR Scanner -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "Arial",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f1ff 0%,
          #fff8f5 50%,
          #eefaff 100%
        );

      color: #34324a;

    }


    /* =================================================
       MAIN
    ================================================= */

    .app {

      width: 100%;

      max-width: 600px;

      margin: auto;

      padding:
        20px
        15px
        35px;

    }


    /* =================================================
       HEADER
    ================================================= */

    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .logo {

      width: 75px;

      height: 75px;

      margin: auto;

      border-radius: 24px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 34px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #9180ef,
          #6c63c9
        );

      box-shadow:
        0 12px 30px
        rgba(
          108,
          99,
          201,
          0.25
        );

    }


    .school-name {

      margin-top: 13px;

      margin-bottom: 3px;

      font-size: 28px;

      font-weight: 800;

      color: #4d467d;

    }


    .school-subtitle {

      color: #888;

      font-size: 15px;

    }


    /* =================================================
       CARD
    ================================================= */

    .card-main {

      background: white;

      border-radius: 28px;

      padding: 20px;

      box-shadow:
        0 15px 50px
        rgba(
          75,
          65,
          120,
          0.10
        );

    }


    /* =================================================
       SCANNER HEADER
    ================================================= */

    .scanner-title {

      text-align: center;

      margin-bottom: 15px;

    }


    .scanner-title h2 {

      font-size: 21px;

      margin-bottom: 4px;

      font-weight: 700;

    }


    .scanner-title p {

      margin: 0;

      color: #888;

      font-size: 14px;

    }


    /* =================================================
       CAMERA
    ================================================= */

    .camera-wrapper {

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 22px;

      background: #111;

      min-height: 320px;

    }


    #reader {

      width: 100%;

    }


    /*
     * HTML5 QR scanner styling
     */

    #reader video {

      width: 100% !important;

      height: auto !important;

      border-radius: 22px;

      object-fit: cover;

    }


    #reader__scan_region {

      background: #111;

    }


    /*
     * Frame overlay
     */

    .scan-frame {

      position: absolute;

      width: 230px;

      height: 230px;

      left: 50%;

      top: 50%;

      transform:
        translate(
          -50%,
          -50%
        );

      border:
        3px solid
        rgba(
          255,
          255,
          255,
          0.9
        );

      border-radius: 25px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px
        rgba(
          0,
          0,
          0,
          0.18
        );

    }


    .scan-frame::after {

      content: "";

      position: absolute;

      left: 15px;

      right: 15px;

      height: 3px;

      top: 50%;

      background:
        rgba(
          255,
          255,
          255,
          0.8
        );

      animation:
        scanLine
        2s
        infinite
        ease-in-out;

    }


    @keyframes scanLine {

      0% {
        top: 15%;
      }

      50% {
        top: 85%;
      }

      100% {
        top: 15%;
      }

    }


    /* =================================================
       CAMERA INFO
    ================================================= */

    .camera-info {

      text-align: center;

      margin-top: 12px;

      color: #777;

      font-size: 13px;

    }


    .camera-mode {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        6px
        12px;

      border-radius: 50px;

      background: #f3f1ff;

      color: #6c63c9;

      font-weight: 600;

    }


    /* =================================================
       BUTTON
    ================================================= */

    .button-group {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    .btn-camera {

      flex: 1;

      border: none;

      border-radius: 16px;

      padding: 14px;

      font-size: 15px;

      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8f7aea,
          #6c63c9
        );

      transition:
        0.2s;

    }


    .btn-camera:hover {

      transform:
        translateY(-1px);

    }


    .btn-camera.secondary {

      color: #6c63c9;

      background: #f0edff;

    }


    .btn-camera:disabled {

      opacity: 0.55;

      cursor: not-allowed;

      transform: none;

    }


    /* =================================================
       FILE SCAN
    ================================================= */

    .file-scan {

      margin-top: 10px;

      text-align: center;

    }


    .file-scan label {

      display: inline-block;

      cursor: pointer;

      color: #6c63c9;

      font-size: 14px;

      font-weight: 600;

    }


    #qrFile {

      display: none;

    }


    /* =================================================
       LOADING
    ================================================= */

    .loading {

      display: none;

      text-align: center;

      margin-top: 18px;

    }


    .loading-text {

      margin-top: 8px;

      font-size: 14px;

      color: #777;

    }


    /* =================================================
       RESULT
    ================================================= */

    .result {

      display: none;

      margin-top: 18px;

      border-radius: 24px;

      padding: 25px;

      text-align: center;

      animation:
        resultIn
        0.35s
        ease;

    }


    @keyframes resultIn {

      from {

        opacity: 0;

        transform:
          translateY(
            15px
          );

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    .result.success {

      display: block;

      background:
        linear-gradient(
          135deg,
          #e8fff3,
          #f5fff9
        );

      color: #18794e;

      border:
        2px solid
        #b9f0d0;

    }


    .result.warning {

      display: block;

      background:
        linear-gradient(
          135deg,
          #fff8df,
          #fffdf5
        );

      color: #8a6200;

      border:
        2px solid
        #f5df9b;

    }


    .result.error {

      display: block;

      background:
        linear-gradient(
          135deg,
          #ffeded,
          #fff8f8
        );

      color: #b42318;

      border:
        2px solid
        #ffc8c4;

    }


    .result-icon {

      font-size: 65px;

      line-height: 1;

      margin-bottom: 13px;

      animation:
        pop
        0.4s
        ease;

    }


    @keyframes pop {

      0% {

        transform:
          scale(
            0.4
          );

      }

      70% {

        transform:
          scale(
            1.15
          );

      }

      100% {

        transform:
          scale(
            1
          );

      }

    }


    .greeting {

      font-size: 15px;

      margin-bottom: 5px;

    }


    .student-name {

      font-size: 28px;

      font-weight: 800;

    }


    .student-class {

      font-size: 16px;

      margin-top: 3px;

    }


    .attendance-label {

      margin-top: 15px;

      font-size: 14px;

    }


    .attendance-time {

      font-size: 35px;

      font-weight: 800;

      margin-top: 3px;

    }


    .message-child {

      margin-top: 15px;

      font-size: 16px;

      font-weight: 600;

    }


    /* =================================================
       FOOTER
    ================================================= */

    .footer {

      text-align: center;

      margin-top: 18px;

      color: #aaa;

      font-size: 12px;

    }


    /* =================================================
       MOBILE
    ================================================= */

    @media(
      max-width: 480px
    ) {

      .app {

        padding:
          12px
          10px
          25px;

      }


      .school-name {

        font-size: 24px;

      }


      .card-main {

        padding: 15px;

        border-radius: 22px;

      }


      .camera-wrapper {

        min-height: 280px;

      }


      .scan-frame {

        width: 210px;

        height: 210px;

      }


      .button-group {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">

    <div class="logo">

      <i
        class="bi bi-mortarboard-fill">
      </i>

    </div>


    <div class="school-name">

      TK CERIA

    </div>


    <div class="school-subtitle">

      Sistem Absensi Siswa

    </div>

  </header>



  <!-- =================================================
       MAIN CARD
  ================================================== -->

  <main class="card-main">


    <div class="scanner-title">

      <h2>

        👋 Yuk, Absen!

      </h2>


      <p>

        Arahkan QR Code kamu ke kamera

      </p>

    </div>



    <!-- CAMERA -->

    <div class="camera-wrapper">

      <div id="reader"></div>

      <div class="scan-frame"></div>

    </div>


    <!-- CAMERA MODE -->

    <div class="camera-info">

      <span
        id="cameraMode"
        class="camera-mode">

        <i
          class="bi bi-camera">
        </i>

        Kamera belum aktif

      </span>

    </div>


    <!-- BUTTONS -->

    <div class="button-group">


      <button
        id="startCamera"
        class="btn-camera"
        onclick="startCamera()"
      >

        <i
          class="bi bi-camera-fill">
        </i>

        AKTIFKAN KAMERA

      </button>


      <button
        id="switchCamera"
        class="btn-camera secondary"
        onclick="switchCamera()"
        style="display:none;"
      >

        <i
          class="bi bi-arrow-repeat">
        </i>

        GANTI KAMERA

      </button>


    </div>


    <!-- FILE -->

    <div class="file-scan">

      <label for="qrFile">

        <i
          class="bi bi-image">
        </i>

        Scan dari foto QR

      </label>


      <input
        id="qrFile"
        type="file"
        accept="image/*"
        onchange="scanFromFile(event)"
      >

    </div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >

      <div
        class="spinner-border text-primary"
        role="status"
      ></div>


      <div class="loading-text">

        Sebentar ya...
        sedang memeriksa absensi 😊

      </div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

    </div>


  </main>


  <footer class="footer">

    🌈 Selamat datang di TK CERIA

  </footer>


</div>



<script>


/* =====================================================
   KONFIGURASI
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbx_2C-GuZ_9utfh8-phU6O2eqB7ZRqkLS_7Y0wg3lGtxv82BZc5xcD06b-vsJBoT_VQ/exec";


/* =====================================================
   VARIABLE
===================================================== */

let scanner = null;

let scanning = false;

let processing = false;


/*
 * Kamera awal:
 *
 * environment = belakang
 * user        = depan
 */

let currentCamera =
  "environment";


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  if (scanning) {

    return;

  }


  try {

    const reader =
      document.getElementById(
        "reader"
      );


    reader.innerHTML = "";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 230,

        height: 230

      },

      aspectRatio: 1.0

    };


    await scanner.start(

      {
        facingMode:
          currentCamera
      },

      config,


      function(decodedText) {

        if (processing) {

          return;

        }


        processing = true;


        prosesQR(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Error scanning
         * tidak perlu ditampilkan.
         */

      }

    );


    scanning = true;


    document.getElementById(
      "startCamera"
    ).disabled = true;


    document.getElementById(
      "switchCamera"
    ).style.display = "block";


    updateCameraUI();


  }

  catch (error) {

    console.error(
      error
    );


    tampilkanError(

      "Kamera belum dapat digunakan. " +

      "Pastikan izin kamera sudah diberikan."

    );

  }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera() {


  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {


    /*
     * Stop kamera sekarang
     */

    await scanner.stop();


    scanning = false;


    /*
     * Ganti mode
     */

    if (
      currentCamera ===
      "environment"
    ) {

      currentCamera =
        "user";

    }

    else {

      currentCamera =
        "environment";

    }


    /*
     * Bersihkan
     */

    document.getElementById(
      "reader"
    ).innerHTML = "";


    /*
     * Buat scanner baru
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 230,

        height: 230

      },

      aspectRatio: 1.0

    };


    /*
     * Jalankan kamera baru
     */

    await scanner.start(

      {
        facingMode:
          currentCamera
      },

      config,


      function(decodedText) {

        if (processing) {

          return;

        }


        processing = true;


        prosesQR(
          decodedText
        );

      },


      function(errorMessage) {

        // abaikan

      }

    );


    scanning = true;


    updateCameraUI();


  }

  catch (error) {

    console.error(
      error
    );


    tampilkanError(

      "Kamera tidak dapat diganti. " +

      "Silakan coba kembali."

    );

  }

}


/* =====================================================
   UPDATE CAMERA UI
===================================================== */

function updateCameraUI() {


  const mode =
    document.getElementById(
      "cameraMode"
    );


  const button =
    document.getElementById(
      "switchCamera"
    );


  if (
    currentCamera ===
    "environment"
  ) {


    mode.innerHTML = `

      <i class="bi bi-camera-rear-fill"></i>

      Kamera Belakang

    `;


    button.innerHTML = `

      <i class="bi bi-camera-fill"></i>

      Kamera Depan

    `;

  }

  else {


    mode.innerHTML = `

      <i class="bi bi-camera-fill"></i>

      Kamera Depan

    `;


    button.innerHTML = `

      <i class="bi bi-camera-rear-fill"></i>

      Kamera Belakang

    `;

  }

}


/* =====================================================
   PROSES QR
===================================================== */

function prosesQR(
  qrCode
) {


  tampilkanLoading(
    true
  );


  /*
   * JSONP callback
   */

  const callbackName =
    "absensiCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {


      try {

        tampilkanLoading(
          false
        );


        tampilkanHasil(
          result
        );

      }

      finally {

        delete window[
          callbackName
        ];

      }


      /*
       * Beri waktu
       * sebelum scan berikutnya.
       */

      setTimeout(

        function() {

          processing =
            false;

        },

        3500

      );

    };


  const script =
    document.createElement(
      "script"
    );


  const url =
    API_URL +

    "?action=scan" +

    "&qr=" +
    encodeURIComponent(
      qrCode
    ) +

    "&callback=" +
    callbackName;


  script.src =
    url;


  script.onerror =
    function() {

      tampilkanLoading(
        false
      );


      tampilkanError(

        "Server absensi tidak dapat dihubungi."

      );


      processing =
        false;

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   SCAN DARI FILE
===================================================== */

async function scanFromFile(
  event
) {


  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  try {


    /*
     * Scanner sementara
     */

    const fileScanner =
      new Html5Qrcode(
        "reader"
      );


    const decodedText =
      await fileScanner.scanFile(
        file,
        true
      );


    prosesQR(
      decodedText
    );


  }

  catch (error) {


    console.error(
      error
    );


    tampilkanError(

      "QR Code tidak ditemukan " +
      "di dalam gambar."

    );

  }


  /*
   * Reset input
   */

  event.target.value =
    "";

}


/* =====================================================
   HASIL
===================================================== */

function tampilkanHasil(
  result
) {


  const box =
    document.getElementById(
      "result"
    );


  /*
   * BERHASIL
   */

  if (
    result.success
  ) {


    box.className =
      "result success";


    box.innerHTML = `

      <div class="result-icon">

        🎉

      </div>


      <div class="greeting">

        Halo!

      </div>


      <div class="student-name">

        ${escapeHTML(
          result.siswa
        )}

      </div>


      <div class="student-class">

        Kelas
        ${escapeHTML(
          result.kelas
        )}

      </div>


      <div class="attendance-label">

        Absensi berhasil pada

      </div>


      <div class="attendance-time">

        ${escapeHTML(
          result.jam
        )}

      </div>


      <div class="mt-2">

        <span
          class="badge text-bg-success"
        >

          ✓
          ${escapeHTML(
            result.status
          )}

        </span>

      </div>


      <div class="message-child">

        🌈 Selamat belajar hari ini!

      </div>

    `;


    /*
     * Suara
     */

    speak(

      "Halo " +

      result.siswa +

      ". Absensi berhasil. " +

      "Selamat belajar hari ini!"

    );


    return;

  }



  /*
   * SUDAH ABSEN
   */

  if (
    result.type ===
    "ALREADY"
  ) {


    box.className =
      "result warning";


    box.innerHTML = `

      <div class="result-icon">

        😊

      </div>


      <div class="greeting">

        Hai!

      </div>


      <div class="student-name">

        ${escapeHTML(
          result.siswa
        )}

      </div>


      <div class="student-class">

        Kelas
        ${escapeHTML(
          result.kelas
        )}

      </div>


      <hr>


      <div>

        Kamu sudah melakukan

        <strong>
          absensi hari ini
        </strong>

      </div>


      <div class="attendance-label">

        Jam masuk

      </div>


      <div class="attendance-time">

        ${escapeHTML(
          String(
            result.jamMasuk
          )
        )}

      </div>


      <div class="message-child">

        💕 Selamat belajar!

      </div>

    `;


    speak(

      "Halo " +

      result.siswa +

      ". Kamu sudah melakukan absensi hari ini. Selamat belajar!"

    );


    return;

  }



  /*
   * QR TIDAK DITEMUKAN
   */

  if (
    result.type ===
    "NOT_FOUND"
  ) {


    tampilkanError(

      "QR Code ini belum terdaftar di sistem."

    );


    speak(

      "Maaf, QR Code ini belum terdaftar."

    );


    return;

  }



  /*
   * SISWA NONAKTIF
   */

  if (
    result.type ===
    "INACTIVE"
  ) {


    tampilkanError(

      "Data siswa tidak aktif."

    );


    return;

  }



  /*
   * ERROR UMUM
   */

  tampilkanError(

    result.message ||
    "Terjadi kesalahan."

  );

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
  message
) {


  const box =
    document.getElementById(
      "result"
    );


  box.className =
    "result error";


  box.innerHTML = `

    <div class="result-icon">

      😅

    </div>


    <strong>

      ${message}

    </strong>


    <div class="message-child">

      Silakan coba lagi ya!

    </div>

  `;

}


/* =====================================================
   LOADING
===================================================== */

function tampilkanLoading(
  status
) {


  document.getElementById(
    "loading"
  ).style.display =

    status
      ? "block"
      : "none";

}


/* =====================================================
   SUARA
===================================================== */

function speak(
  text
) {


  /*
   * Browser harus mendukung
   * Speech Synthesis.
   */

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  /*
   * Hentikan suara sebelumnya
   */

  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  /*
   * Bahasa Indonesia
   */

  utterance.lang =
    "id-ID";


  /*
   * Suara sedikit lebih
   * lambat dan ramah anak
   */

  utterance.rate =
    0.9;


  utterance.pitch =
    1.15;


  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
