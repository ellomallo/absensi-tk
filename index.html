<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scan Absensi TK</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <!-- QR Scanner -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8f5ff,
          #fff7f5
        );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .scanner-container {

      width: 100%;

      max-width: 520px;

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .logo {

      width: 70px;

      height: 70px;

      margin: auto;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #8f7aea,
          #6c63c9
        );

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 32px;

      box-shadow:
        0 10px 25px
        rgba(108,99,201,0.25);

    }


    .header h1 {

      font-size: 28px;

      font-weight: 700;

      margin-top: 15px;

      margin-bottom: 5px;

    }


    .header p {

      color: #777;

      margin: 0;

    }


    .scanner-card {

      background: white;

      border-radius: 25px;

      padding: 25px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.08);

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

    }


    .camera-button {

      width: 100%;

      border: none;

      border-radius: 15px;

      padding: 14px;

      background:
        linear-gradient(
          135deg,
          #8f7aea,
          #6c63c9
        );

      color: white;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;

      margin-top: 15px;

    }


    .camera-button:hover {

      opacity: 0.9;

    }


    .camera-button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    .result {

      display: none;

      margin-top: 20px;

      border-radius: 20px;

      padding: 25px;

      text-align: center;

    }


    .result.success {

      display: block;

      background: #e9fff2;

      color: #18794e;

    }


    .result.warning {

      display: block;

      background: #fff7df;

      color: #946200;

    }


    .result.error {

      display: block;

      background: #ffecec;

      color: #b42318;

    }


    .result-icon {

      font-size: 55px;

      margin-bottom: 10px;

    }


    .student-name {

      font-size: 25px;

      font-weight: 700;

    }


    .student-class {

      font-size: 17px;

      margin-bottom: 15px;

    }


    .time {

      font-size: 32px;

      font-weight: 700;

    }


    .instruction {

      text-align: center;

      margin-top: 15px;

      color: #777;

      font-size: 14px;

    }


    .footer {

      text-align: center;

      margin-top: 20px;

      color: #999;

      font-size: 13px;

    }


    .loading {

      display: none;

      text-align: center;

      margin-top: 15px;

    }

  </style>

</head>


<body>


<div class="scanner-container">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">

      <i class="bi bi-mortarboard-fill"></i>

    </div>

    <h1>ABSENSI TK</h1>

    <p>Sistem Absensi Siswa</p>

  </div>



  <!-- SCANNER -->

  <div class="scanner-card">


    <div class="text-center mb-3">

      <h4>

        <i class="bi bi-qr-code-scan"></i>

        Scan QR Siswa

      </h4>

      <p class="text-muted mb-0">

        Arahkan QR Code siswa ke kamera

      </p>

    </div>


    <div id="reader"></div>


    <button
      id="startCamera"
      class="camera-button"
      onclick="startCamera()"
    >

      <i class="bi bi-camera-fill"></i>

      AKTIFKAN KAMERA

    </button>


    <div
      id="loading"
      class="loading"
    >

      <div
        class="spinner-border text-primary"
        role="status"
      ></div>

      <div class="mt-2">

        Memproses absensi...

      </div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

    </div>


    <div class="instruction">

      Pastikan QR Code terlihat jelas di kamera.

    </div>


  </div>


  <div class="footer">

    Sistem Absensi TK © 2026

  </div>


</div>



<script>


/*
==================================================
KONFIGURASI
==================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbx_2C-GuZ_9utfh8-phU6O2eqB7ZRqkLS_7Y0wg3lGtxv82BZc5xcD06b-vsJBoT_VQ/exec";


let scanner = null;

let scanning = false;

let processing = false;



/*
==================================================
START CAMERA
==================================================
*/

function startCamera() {


  if (scanning) {

    return;

  }


  const reader =
    document.getElementById("reader");


  reader.innerHTML = "";


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    },

    aspectRatio: 1.0

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText) {

      if (processing) {

        return;

      }


      processing = true;


      prosesQR(decodedText);

    },

    function(errorMessage) {

      // Error scan sementara diabaikan

    }

  )

  .then(function() {

    scanning = true;

    document.getElementById(
      "startCamera"
    ).disabled = true;

  })

  .catch(function(error) {

    console.error(error);

    tampilkanError(

      "Kamera tidak dapat digunakan.<br><br>" +

      "Pastikan browser sudah diberi izin kamera " +

      "dan halaman dibuka melalui HTTPS."

    );

  });

}



/*
==================================================
PROSES QR
==================================================
*/

function prosesQR(qrCode) {


  tampilkanLoading(true);


  /*
   * JSONP
   *
   * Kita tidak menggunakan fetch()
   * supaya scanner bisa berkomunikasi
   * dengan Apps Script lintas domain.
   */


  const callbackName =
    "absensiCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {


      try {

        tampilkanLoading(false);

        tampilkanHasil(result);

      }

      finally {

        delete window[callbackName];

      }


      /*
       * Beri waktu 3 detik
       * sebelum scanner kembali aktif.
       */

      setTimeout(function() {

        processing = false;

      }, 3000);

    };


  const script =
    document.createElement("script");


  const url =
    API_URL +

    "?action=scan" +

    "&qr=" +
    encodeURIComponent(qrCode) +

    "&callback=" +
    callbackName;


  script.src = url;


  script.onerror =
    function() {

      tampilkanLoading(false);

      tampilkanError(

        "Tidak dapat terhubung " +
        "ke server absensi."

      );

      processing = false;

    };


  document.body.appendChild(script);

}



/*
==================================================
LOADING
==================================================
*/

function tampilkanLoading(status) {

  document.getElementById(
    "loading"
  ).style.display =
    status ? "block" : "none";

}



/*
==================================================
HASIL ABSENSI
==================================================
*/

function tampilkanHasil(result) {


  const box =
    document.getElementById(
      "result"
    );


  /*
   * BERHASIL
   */

  if (result.success) {


    box.className =
      "result success";


    box.innerHTML = `

      <div class="result-icon">

        ✅

      </div>


      <div class="student-name">

        ${escapeHTML(result.siswa)}

      </div>


      <div class="student-class">

        Kelas ${escapeHTML(result.kelas)}

      </div>


      <hr>


      <div>

        Absensi berhasil

      </div>


      <div class="time">

        ${escapeHTML(result.jam)}

      </div>


      <span class="badge text-bg-success">

        ${escapeHTML(result.status)}

      </span>

    `;


    return;

  }



  /*
   * SUDAH ABSEN
   */

  if (result.type === "ALREADY") {


    box.className =
      "result warning";


    box.innerHTML = `

      <div class="result-icon">

        ⚠️

      </div>


      <div class="student-name">

        ${escapeHTML(result.siswa)}

      </div>


      <div class="student-class">

        Kelas ${escapeHTML(result.kelas)}

      </div>


      <hr>


      <strong>

        Siswa sudah melakukan absensi hari ini.

      </strong>


      <div class="mt-2">

        Jam masuk:

        <strong>

          ${escapeHTML(
            String(result.jamMasuk)
          )}

        </strong>

      </div>

    `;


    return;

  }



  /*
   * ERROR
   */

  tampilkanError(

    result.message ||
    "Terjadi kesalahan."

  );

}



/*
==================================================
ERROR
==================================================
*/

function tampilkanError(message) {


  const box =
    document.getElementById(
      "result"
    );


  box.className =
    "result error";


  box.innerHTML = `

    <div class="result-icon">

      ❌

    </div>


    <strong>

      ${message}

    </strong>

  `;

}



/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


</script>


</body>

</html>
